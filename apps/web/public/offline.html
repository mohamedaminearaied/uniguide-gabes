<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <title>UniGuide Gabès — offline</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
    .box{max-width:360px}
    .logo{width:72px;height:72px;border-radius:20px;background:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px}
    button{margin-top:20px;border:0;border-radius:10px;background:#1d4ed8;color:#fff;padding:12px 22px;font-size:15px;font-weight:600}
    p{color:#475569;line-height:1.5}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">📍</div>
    <h1>You are offline</h1>
    <p>Pas de connexion · لا يوجد اتصال</p>
    <p>Reconnect to the internet to load the map. Places you already opened may still be available.</p>
    <button onclick="location.reload()">Retry · Réessayer · إعادة المحاولة</button>
  </div>
</body>
</html>
